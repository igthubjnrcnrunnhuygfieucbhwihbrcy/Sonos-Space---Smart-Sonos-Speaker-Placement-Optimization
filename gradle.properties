# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Enables new incubating mode that makes Gradle more responsive when working with
# Android projects. More details, visit:
# https://developer.android.com/studio/preview/features#improved-gradle-sync
# android.enableBuildCache=true
# android.buildCacheDirectory=$ANDROID_HOME/.android/build-cache

# Enables the Gradle Daemon to reduce the time it takes to run Gradle builds.
# More details, visit: https://developer.android.com/studio/build/optimize-your-build.html
org.gradle.daemon=true

# Enables the build cache to reuse outputs from previous builds.
# More details, visit: https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# Enables configuration caching to speed up build times.
# More details, visit: https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true
android.enableJetifier=true
